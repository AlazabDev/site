<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard</title>
  <link rel="stylesheet" href="assets/static-conversion.css">
</head>
<body>
  <header class="azab-topbar">
    <strong>Dashboard</strong> · <a href="index.html">فهرس الصفحات</a>
  </header>
  <div class="azab-shell">
    <article class="azab-card converted-page">
      <div class="component-placeholder" data-component="DashboardLayout">
      <div class="space-y-6">
        <span class="icon-placeholder">WelcomeCard</span>
        
        <div class="component-placeholder" data-component="DashboardStats"></span>
          pendingMaintenance=<span data-js-var="data.pendingMaintenance"></span>
          completedTasks=<span data-js-var="data.completedTasks"></span>
          activeProjects=<span data-js-var="data.activeProjects"></span>
        />

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
          <div class="component-placeholder" data-component="RecentProjects"></span>
            isLoading=<span data-js-var="isLoading"></span>
          />
          
          <div class="space-y-6">
            <!-- يمكن إضافة مكونات أخرى هنا مستقبلاً -->
          </div>
        </div>
      </div>
    </div>
      <div class="source-note">تم التحويل من الملف الأصلي: <code>DashboardPage.tsx</code>. هذه نسخة HTML ثابتة؛ الأجزاء المعتمدة على React/JavaScript أو مكوّنات خارج الحزمة ظهرت كعناصر Placeholder.</div>
    </article>
  </div>
</body>
</html>
